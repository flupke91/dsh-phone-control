# dsh-phone-control — bundle patch layer for the `web` profile.
#
# Applied after the dsh-web-app layer, this patch makes the web GUI reachable
# from other devices on the same LAN:
#
# 1. webserver: bind all interfaces (0.0.0.0). The CLI rejects `--host 0.0.0.0`
#    on purpose (it would expose remote code execution to the network); this
#    config-level patch is the deployment escape hatch. The port still follows
#    `dsh web --port` when given.
#
# 2. insert: the host plugin, which does two things:
#    a. injects a crypto.randomUUID polyfill into the served index.html
#       (browsers only expose Crypto.randomUUID() in secure contexts; a
#       plain-HTTP LAN origin is NOT one, so without the polyfill every RPC
#       crashes and the session list stays empty);
#    b. watches the machine's network interfaces and, when the LAN IP changes,
#       rewrites a managed `connection` override in the profile's own
#       cordis.patch.yml — the user patch layer hot-reloads, so the /api
#       trust fence follows the new IP within seconds (no restart, no manual
#       edits).
#
# No installed files are modified; only official mechanisms are used: the
# bundle patch layer, the index-tap hook, and the user patch layer.

- id: webserver
  config:
    host: 0.0.0.0
    port: !!js ctx.webStartup.port ?? 3080

- insert:
    - id: lan-phone-control
      name: 'dsh-phone-control'
      inject: [webServer]
      config: {}
